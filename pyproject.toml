[project]
name = "funtypecho"
version = "0.1.12"
description = "funtypecho"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "牛哥", email = "farfarfun@qq.com" }]
dependencies = ["farlog>=1.1.7"]

[project.optional-dependencies]
publish = ["nbconvert>=7.16", "nbformat>=5.10", "PyYAML>=6.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funtypecho"]
